{# Fixed ad slot. Renders nothing until site.adsense_slot is set in build.py.
   (Auto ads work from the script in base.html alone.) #}
{% macro ad(kind="inline") %}
{% if site.adsense_client and site.adsense_slot %}
<div class="ad-slot {{ kind }}">
  <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="{{ site.adsense_client }}"
       data-ad-slot="{{ site.adsense_slot }}" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% endif %}
{% endmacro %}
