{# Ad slot. Renders nothing until site.adsense_client is set in build.py. #}
{% macro ad(kind="inline") %}
{% if site.adsense_client %}
<div class="ad-slot {{ kind }}">
  <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="{{ site.adsense_client }}"
       data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% endif %}
{% endmacro %}
